# ARK OS framework configuration
# This file declares the framework version and modules active in this repository.
# Planned tooling (not published yet): npx arkos upgrade, npx arkos proof.

# The version of the ARK OS framework this repository was initialised with.
arkos-version: "0.2.1"

# Short identifier for this project. Used in proof sheet generation.
project: "arkos"

# Conformance declaration. Update if your project adopts additional standards.
conformance:
  security: "OWASP ASVS v5.0.0 Level 1"
  cyber: "ASD Essential Eight ML1"
  privacy: "APP 1, 5, 11"
  accessibility: "WCAG 2.2 AA"
  sbom: "CycloneDX 1.6+"

# Modules in use. Add stack-specific modules as you adopt them.
# Example: arkos-module-nextjs, arkos-module-fastify, arkos-module-llm-feature
modules:
  - arkos-module-intelligence

# IDE adapters active in this repository.
# Set to true only for adapters that have a corresponding file wired.
ide-adapters:
  claude-code: true      # CLAUDE.md present
  github-copilot: true   # .github/copilot-instructions.md present
  cursor: true           # .cursor/rules/arkos.mdc present
  claude-extension: true # .claude/ rules, commands, and hooks present

# Date this repository was initialised with ARK OS. Replace with today's date (YYYY-MM-DD) before your first commit.
created: "<YYYY-MM-DD>"
