name: arkos

# ARK OS CI workflow - governance gates only.
#
# This workflow enforces the five ARK OS governance gates (Research, Plan, Build,
# Ship, Run). It does NOT deploy anything.
#
# Deployment is intentionally excluded from this template. It is hosting-specific
# (Vercel, AWS, GCP, fly.io, Docker, bare metal) and environment-specific (staging
# vs production promotion rules vary per team). Add your deployment workflow in a
# separate file, for example .github/workflows/deploy.yml, after adopting this
# template.
#
# What this workflow does:
#   plan-gate     - verifies every PR references an approved spec
#   build-gate    - runs lint, typecheck, tests, accessibility, banned-pattern, Intelligence module, and product AI checks
#   ship-gate     - generates SBOM, verifies CHANGELOG, runs SAST and dependency scan
#   run-readiness - prints the human sign-off checklist required before production promotion
#
# When each job runs:
#   plan-gate     - every PR and every push to main
#   build-gate    - every PR and every push to main (requires plan-gate to pass)
#   ship-gate     - pushes to main only (requires build-gate to pass)
#   run-readiness - pushes to main only (requires build-gate to pass)
#
# Nothing in this file pushes, publishes, or releases to any environment.

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default. Individual jobs may extend as needed.
permissions:
  contents: read

jobs:
  plan-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check spec reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash .arkos/scripts/check-spec-link.sh

  build-gate:
    runs-on: ubuntu-latest
    needs: plan-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          # Replace with your stack's install command.
          # Example (Node.js): pnpm install --frozen-lockfile
          # Example (Python):  pip install -r requirements.txt
          echo "REPLACE: add your install command above and remove this line"

      - name: Lint
        run: |
          # Replace with your stack's lint command.
          # Example (Node.js): pnpm lint
          # Example (Python):  ruff check .
          echo "REPLACE: add your lint command above and remove this line"

      - name: Typecheck
        run: |
          # Replace with your stack's typecheck command.
          # Example (Node.js): pnpm typecheck
          # Example (Python):  mypy .
          echo "REPLACE: add your typecheck command above and remove this line"

      - name: Unit tests
        run: |
          # Replace with your stack's unit test command.
          # Example (Node.js): pnpm test:unit
          # Example (Python):  pytest tests/unit
          echo "REPLACE: add your unit test command above and remove this line"

      - name: Integration tests
        run: |
          # Replace with your stack's integration test command.
          # Example (Node.js): pnpm test:integration
          # Example (Python):  pytest tests/integration
          echo "REPLACE: add your integration test command above and remove this line"

      - name: Accessibility tests (WCAG 2.2 AA)
        run: |
          # Replace with your stack's accessibility test command.
          # Example (Node.js): pnpm test:a11y
          # Example (static):  pa11y-ci
          echo "REPLACE: add your accessibility test command above and remove this line"

      - name: Contract tests
        run: |
          # Replace with your stack's contract test command.
          # Example (Node.js): pnpm test:contracts
          echo "REPLACE: add your contract test command above and remove this line"

      - name: Banned pattern check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash .arkos/scripts/check-banned-patterns.sh

      - name: Intelligence module check
        run: bash modules/intelligence/tests/check-module.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Intelligence module tests
        run: dotnet test modules/intelligence/Arkos.Intelligence.sln --nologo

      - name: Product AI policy check
        run: bash .arkos/scripts/check-product-ai.sh

      - name: Product AI policy tests
        run: bash .arkos/scripts/tests/check-product-ai/run.sh

      - name: CHANGELOG updated
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .arkos/scripts/check-changelog.sh

  ship-gate:
    # Ship gate: collects release evidence. Does NOT deploy.
    # Add deployment steps in a separate workflow file.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate SBOM (CycloneDX)
        run: |
          # Replace with your stack's CycloneDX SBOM command.
          # Example (Node.js): pnpm exec cyclonedx-npm --output-file sbom.cdx.json
          # Example (Python):  cyclonedx-py --output sbom.cdx.json
          # Other stacks: see https://cyclonedx.org/tool-center/
          echo "REPLACE: add your SBOM generation command above and remove this line"

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: SAST - static analysis
        # Replace with a SAST tool appropriate for your stack.
        #
        # CodeQL (free for public repos, GitHub Advanced Security required for private):
        #   CodeQL requires two steps: init (declares language) then analyze.
        #   See https://docs.github.com/en/code-security/code-scanning/using-codeql-code-scanning-with-your-existing-ci-system
        #   Example:
        #     - uses: github/codeql-action/init@v3
        #       with:
        #         languages: javascript  # or python, java, go, ruby, swift, cpp, csharp
        #     - uses: github/codeql-action/analyze@v3
        #
        # Semgrep (open source, works for all stacks):
        #   - uses: returntocorp/semgrep-action@v1
        #
        # Remove this placeholder once you have configured a real SAST step.
        run: |
          echo "REPLACE: configure a SAST step for your stack (see comment above)"

      - name: Dependency vulnerability scan
        # Replace with a dependency scanner appropriate for your stack.
        #
        # Trivy (works for most stacks, no token required):
        #   - uses: aquasecurity/trivy-action@master
        #     with:
        #       scan-type: fs
        #       severity: CRITICAL,HIGH
        #
        # OSV-Scanner (Google, open source):
        #   - uses: google/osv-scanner-action@v1
        #
        # Remove this placeholder once you have configured a real scan step.
        run: |
          echo "REPLACE: configure a dependency scan step for your stack (see comment above)"

  run-readiness:
    runs-on: ubuntu-latest
    needs: build-gate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run readiness check
        run: |
          echo "Run gate criteria are documented in .arkos/gates/run.yml"
          echo "Complete the run-readiness checklist in .arkos/proof-sheet.md before promoting to production."
          echo "CI cannot automate all run gate criteria. Human sign-off is required."
